<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Video browser contract</title>
</head>
<body data-result="pending">
    <div class="video" id="facade" data-autoplay-src="https://example.test/autoplay">
        <iframe data-src="https://example.test/idle" tabindex="-1" title="Vidéo"></iframe>
        <button type="button" class="poster">Lire</button>
    </div>

    <div class="video" id="lazy">
        <video data-lazy-autoplay></video>
    </div>

    <div class="video" id="external" data-autoplay="false">
        <iframe data-src="https://example.test/visible" title="Vidéo externe"></iframe>
    </div>

    <script type="module">
        const failures = [];
        const assert = (condition, message) => {
            if (!condition) failures.push(message);
        };

        window.matchMedia = () => ({
            matches: true,
            addEventListener() {},
        });

        let disconnected = false;
        window.IntersectionObserver = class {
            constructor(callback) {
                this.callback = callback;
            }
            observe(target) {
                this.callback([{ isIntersecting: true, target }]);
            }
            disconnect() {
                disconnected = true;
            }
        };

        const { default: initVideo } = await import('/assets/components/video/video.js');
        const facade = document.querySelector('#facade');
        const iframe = facade.querySelector('iframe');
        const poster = facade.querySelector('.poster');
        const destroyFacade = initVideo(facade);

        assert(!iframe.hasAttribute('src'), 'La source externe est chargée avant le clic');
        poster.click();
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        assert(facade.classList.contains('is-playing'), 'La façade ne passe pas en lecture');
        assert(poster.hidden, 'Le poster reste visible');
        assert(iframe.src === 'https://example.test/autoplay', 'La source autoplay de l’iframe n’est pas chargée');
        assert(!iframe.hasAttribute('tabindex'), 'L’iframe reste hors de l’ordre de tabulation');

        const lazy = document.querySelector('#lazy');
        const video = lazy.querySelector('video');
        const destroyLazy = initVideo(lazy);
        assert(video.controls, 'Reduced motion ne rétablit pas les contrôles');

        const external = document.querySelector('#external');
        const externalIframe = external.querySelector('iframe');
        assert(!externalIframe.hasAttribute('src'), 'Le lecteur externe est chargé avant son initialisation visible');
        const destroyExternal = initVideo(external);
        assert(externalIframe.src === 'https://example.test/visible', 'Le lecteur externe visible sans poster n’est pas chargé');

        destroyFacade?.();
        destroyLazy?.();
        destroyExternal?.();
        assert(!iframe.hasAttribute('src'), 'La destruction ne décharge pas le lecteur externe');
        assert(!externalIframe.hasAttribute('src'), 'La destruction ne décharge pas le lecteur externe sans poster');
        assert(disconnected, 'L’IntersectionObserver n’est pas nettoyé');

        document.body.dataset.result = failures.length === 0 ? 'pass' : 'fail';
        document.body.textContent = failures.join('\n');
    </script>
</body>
</html>
