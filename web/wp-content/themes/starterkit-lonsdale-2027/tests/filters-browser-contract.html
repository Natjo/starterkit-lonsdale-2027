<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Filters browser contract</title>
</head>
<body data-result="pending">
    <form action="/projects/" data-filters-group="projects" data-filters-target="results" data-filters-submit-on-change="false">
        <input name="filter_search" value="identité">
        <input type="hidden" name="filter_sort" value="title_asc">
        <button type="submit">Rechercher</button>
    </form>
    <form action="/projects/" data-filters-group="projects" data-filters-target="results" data-filters-submit-on-change="false">
        <input type="checkbox" name="project_type[]" value="website" checked>
        <input type="hidden" name="filter_search" value="identité">
        <input type="hidden" name="filter_sort" value="title_asc">
        <a class="filters-reset" href="/projects/">Réinitialiser</a>
    </form>
    <form action="/projects/" data-filters-group="projects" data-filters-target="results" data-filters-submit-on-change="true">
        <select name="filter_sort">
            <option value="date_desc">Date</option>
            <option value="title_asc" selected>Titre</option>
        </select>
        <input type="hidden" name="filter_search" value="identité">
        <input type="hidden" name="project_type[]" value="website">
    </form>
    <div id="results"><a class="initial">Résultats initiaux</a></div>

    <form action="/projects/" data-filters-group="pretty" data-filters-target="pretty-results" data-filters-submit-on-change="false" data-filters-pretty="true" data-filters-pretty-base="/projects/filters/" data-filters-pretty-params="project_type,filter_sort">
        <input type="checkbox" name="project_type[]" value="application" checked>
        <select name="filter_sort">
            <option value="date_desc" selected>Date</option>
        </select>
        <button type="submit">Filtrer</button>
    </form>
    <div id="pretty-results"><span class="pretty-initial">Résultats lisibles initiaux</span></div>

    <script type="module">
        import initializeFilters from "/assets/components/filters/filters.js";

        const assert = (condition, message) => {
            if (!condition) throw new Error(message);
        };
        const tick = () => new Promise(resolve => setTimeout(resolve, 0));
        const requests = [];

        window.fetch = async (input) => {
            const url = new URL(input, window.location.href);
            requests.push(url);
            if (url.pathname.startsWith("/projects/filters/")) {
                const prettyForm = document.querySelector('[data-filters-group="pretty"]').outerHTML;
                return new Response(`<!doctype html><html><head><title>Filtres lisibles</title></head><body>${prettyForm}<div id="pretty-results"><p class="pretty-updated">Mis à jour</p></div></body></html>`, {
                    status: 200,
                    headers: { "Content-Type": "text/html" },
                });
            }
            const forms = Array.from(document.querySelectorAll('[data-filters-group="projects"]'))
                .map(form => form.outerHTML)
                .join("");
            return new Response(`<!doctype html><html><head><title>Résultats AJAX</title></head><body>${forms}<div id="results"><p class="updated">${url.search}</p><nav class="pagination"><a href="/projects/page/2/?filter_search=identit%C3%A9">2</a></nav></div></body></html>`, {
                status: 200,
                headers: { "Content-Type": "text/html" },
            });
        };

        try {
            const destroys = Array.from(document.querySelectorAll('[data-filters-group="projects"]'))
                .map(initializeFilters);

            document.querySelector('[name="filter_search"]').value = "nouveau";
            document.querySelector('form').requestSubmit();
            await tick();
            await tick();

            assert(requests.length === 1, "one grouped request");
            assert(requests[0].searchParams.get("filter_search") === "nouveau", "visible search wins over hidden copies");
            assert(requests[0].searchParams.getAll("filter_search").length === 1, "search deduplicated");
            assert(requests[0].searchParams.get("filter_sort") === "title_asc", "sort merged");
            assert(requests[0].searchParams.getAll("project_type[]").includes("website"), "taxonomy merged");
            assert(document.querySelector("#results .updated"), "target replaced");
            assert(document.title === "Résultats AJAX", "title updated");

            document.querySelector("#results .pagination a").click();
            await tick();
            await tick();
            assert(requests.length === 2 && requests[1].pathname.includes("page/2"), "pagination intercepted");

            document.querySelector(".filters-reset").click();
            await tick();
            await tick();
            assert(requests.length === 3 && requests[2].search === "", "reset intercepted");

            const destroyPretty = initializeFilters(document.querySelector('[data-filters-group="pretty"]'));
            document.querySelector('[data-filters-group="pretty"]').requestSubmit();
            await tick();
            await tick();
            const prettyRequest = requests[3];
            assert(prettyRequest.pathname === "/projects/filters/project_type/application/filter_sort/date_desc/", "pretty filter path generated");
            assert(prettyRequest.search === "", "pretty parameters removed from query string");
            assert(document.querySelector("#pretty-results .pretty-updated"), "pretty target replaced");

            destroys.forEach(destroy => destroy?.());
            destroyPretty?.();
            document.body.dataset.result = "ok";
        } catch (error) {
            document.body.dataset.result = error.message;
        }
    </script>
</body>
</html>
