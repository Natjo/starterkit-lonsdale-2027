<!doctype html>
<meta charset="utf-8">
<title>Styleguide copy contract</title>
<div id="root"><aside class="styleguide-readme"><pre><code>component(<span class="hljs-string">'btn'</span>, ['name' =&gt; 'Voir']);
</code></pre><pre><code>const value = 42;</code></pre></aside></div>
<pre id="result">PENDING</pre>
<script type="module">
import initStyleguide from '/assets/pages/styleguide/styleguide.js';
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const wait = () => new Promise(resolve => setTimeout(resolve, 0));
try {
    const root = document.querySelector('#root');
    const original = root.innerHTML;
    Object.defineProperty(navigator, 'clipboard', { configurable: true, value: undefined });
    const destroyWithoutClipboard = initStyleguide(root);
    assert(root.innerHTML === original, 'no controls without Clipboard API');
    destroyWithoutClipboard();
    let copied = '';
    let rejectCopy = false;
    Object.defineProperty(navigator, 'clipboard', { configurable: true, value: {
        async writeText(text) { if (rejectCopy) throw new Error('denied'); copied = text; },
    } });
    const destroy = initStyleguide(root);
    const buttons = [...root.querySelectorAll('[data-styleguide-copy]')];
    assert(buttons.length === 2, 'one control per block');
    assert(buttons[0].type === 'button' && buttons[0].getAttribute('aria-label') === 'Copier le code', 'accessible button');
    buttons[0].querySelector('svg').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await wait();
    assert(copied === "component('btn', ['name' => 'Voir']);\n", 'copies raw code, preserving line breaks');
    assert(buttons[0].dataset.copyState === 'success', 'visual success');
    assert(root.querySelector('[role="status"]').textContent === 'Code copié', 'accessible success');
    assert(!buttons[1].dataset.copyState, 'other block unchanged');
    await new Promise(resolve => setTimeout(resolve, 1900));
    assert(!buttons[0].dataset.copyState && buttons[0].title === 'Copier le code', 'feedback resets');
    rejectCopy = true;
    buttons[1].click(); await wait();
    assert(buttons[1].dataset.copyState === 'error', 'clipboard denial reported');
    destroy();
    assert(root.innerHTML === original, 'destroy restores original markup');
    copied = '';
    buttons[0].click(); await wait();
    assert(copied === '', 'destroy removes listener');
    let resolveCopy;
    navigator.clipboard.writeText = () => new Promise(resolve => { resolveCopy = resolve; });
    const destroyPending = initStyleguide(root);
    root.querySelector('button').click();
    destroyPending(); resolveCopy(); await wait();
    assert(root.innerHTML === original, 'pending copy does not mutate a destroyed module');
    const tokenRoot = document.createElement('div');
    tokenRoot.innerHTML = '<span data-styleguide-token="--styleguide-contract"></span>';
    document.body.append(tokenRoot);
    document.documentElement.style.setProperty('--styleguide-contract', '8px');
    const destroyTokens = initStyleguide(tokenRoot);
    assert(tokenRoot.textContent === '8px', 'style token value is rendered');
    document.documentElement.style.setProperty('--styleguide-contract', '16px');
    window.dispatchEvent(new Event('resize'));
    assert(tokenRoot.textContent === '16px', 'style token value follows responsive changes');
    destroyTokens();
    document.documentElement.style.setProperty('--styleguide-contract', '24px');
    window.dispatchEvent(new Event('resize'));
    assert(tokenRoot.textContent === '16px', 'destroy removes token resize listener');
    document.documentElement.style.removeProperty('--styleguide-contract');
    tokenRoot.remove();
    const oldLayout = document.documentElement.style.getPropertyValue('--layout');
    document.documentElement.style.setProperty('--layout', '[full] 20px [fluid] 40px [ctr] 280px [ctr-end] 40px [fluid-end] 20px [full-end]');
    const layoutRoot = document.createElement('div');
    layoutRoot.innerHTML = '<div data-styleguide-layout style="display:grid;grid-template-columns:var(--layout);width:400px">' +
        ['full', 'fluid', 'ctr', 'ctr-sm'].map(name => `<div data-layout-rail="${name}"><code data-layout-placement></code><span data-layout-width></span></div>`).join('') + '<div data-layout-rail="ctr" data-layout-end="fluid" style="min-width:0"><code data-layout-placement></code><span data-layout-width></span></div></div>';
    document.body.append(layoutRoot);
    const destroyLayout = initStyleguide(layoutRoot);
    const rail = name => layoutRoot.querySelector(`[data-layout-rail="${name}"]`);
    assert(rail('full').querySelector('[data-layout-width]').textContent === '400 px', 'full rail uses full grid width');
    assert(rail('fluid').querySelector('[data-layout-width]').textContent === '360 px', 'fluid rail respects offsets');
    assert(rail('ctr').querySelector('[data-layout-width]').textContent === '280 px', 'ctr rail respects named tracks');
    assert(rail('ctr-sm').hidden, 'missing rails stay hidden');
    assert(layoutRoot.querySelector('[data-layout-end] [data-layout-width]').textContent === '320 px', 'mixed ctr / fluid rail uses named endpoints');
    document.documentElement.style.setProperty('--layout', '[full] 20px [fluid ctr] 360px [ctr-end fluid-end] 20px [full-end]');
    window.dispatchEvent(new Event('resize'));
    assert(rail('ctr').querySelector('[data-layout-width]').textContent === '360 px', 'layout updates after resize');
    destroyLayout(); layoutRoot.remove();
    if (oldLayout) document.documentElement.style.setProperty('--layout', oldLayout);
    else document.documentElement.style.removeProperty('--layout');
    const widthDescriptor = Object.getOwnPropertyDescriptor(window, 'innerWidth');
    Object.defineProperty(window, 'innerWidth', { configurable: true, value: 700 });
    const breakpointsRoot = document.createElement('div');
    breakpointsRoot.innerHTML = '<span data-styleguide-viewport></span><table><tbody><tr data-breakpoint-min="576" data-breakpoint-max="767"><td>sm</td></tr><tr data-breakpoint-min="768"><td>md</td></tr></tbody></table>';
    const indicator = document.createElement('aside');
    indicator.dataset.styleguideBreakpoint = '';
    indicator.dataset.breakpoints = JSON.stringify([{ name: 'sm', width: 576 }, { name: 'md', width: 768 }]);
    indicator.hidden = true;
    indicator.innerHTML = '<strong data-breakpoint-name></strong><span data-breakpoint-range></span><span data-styleguide-viewport></span>';
    breakpointsRoot.append(indicator);
    document.body.append(breakpointsRoot);
    const destroyBreakpoints = initStyleguide(breakpointsRoot);
    assert(breakpointsRoot.querySelector('.is-active').textContent === 'sm', 'current breakpoint is highlighted');
    assert(!indicator.hidden && indicator.querySelector('[data-breakpoint-name]').textContent === 'sm' && indicator.querySelector('[data-breakpoint-range]').textContent === '576–767 px', 'floating indicator shows current breakpoint and range');
    Object.defineProperty(window, 'innerWidth', { configurable: true, value: 900 });
    window.dispatchEvent(new Event('resize'));
    assert(breakpointsRoot.querySelector('.is-active').textContent === 'md', 'breakpoint follows resize');
    assert(breakpointsRoot.querySelector('[data-styleguide-viewport]').textContent === '900 px', 'viewport width is displayed');
    assert(indicator.querySelector('[data-breakpoint-name]').textContent === 'md', 'floating indicator follows resize');
    Object.defineProperty(window, 'innerWidth', { configurable: true, value: 400 });
    window.dispatchEvent(new Event('resize'));
    assert(indicator.querySelector('[data-breakpoint-name]').textContent === 'Sous sm' && indicator.querySelector('[data-breakpoint-range]').textContent === '< 576 px', 'floating indicator handles widths below first breakpoint');
    destroyBreakpoints(); breakpointsRoot.remove();
    Object.defineProperty(window, 'innerWidth', widthDescriptor);
    const anchorRoot = document.createElement('div');
    anchorRoot.style.setProperty('--styleguide-demo-top', '80px');
    anchorRoot.innerHTML = '<a href="#anchor-contract-target">Section</a><section id="anchor-contract-target"></section>';
    document.body.append(anchorRoot);
    const oldLenis = window.lenis, oldScrollTo = window.scrollTo, oldMatchMedia = window.matchMedia, oldUrl = location.href;
    let reduceMotion = false, scrollCall;
    window.matchMedia = () => ({ get matches() { return reduceMotion; } });
    window.lenis = { scrollTo(target, options) { scrollCall = { target, options }; } };
    const destroyAnchors = initStyleguide(anchorRoot);
    anchorRoot.querySelector('a').click();
    assert(scrollCall.target === window.scrollY + anchorRoot.querySelector('section').getBoundingClientRect().top - 80 && !scrollCall.options.immediate, 'anchor uses smooth Lenis with sticky offset');
    assert(location.hash === '#anchor-contract-target', 'anchor updates URL');
    reduceMotion = true; anchorRoot.querySelector('a').click();
    assert(scrollCall.options.immediate, 'reduced motion uses immediate Lenis');
    window.lenis = undefined;
    window.scrollTo = options => { scrollCall = options; };
    reduceMotion = false; anchorRoot.querySelector('a').click();
    assert(scrollCall.behavior === 'smooth', 'native smooth fallback');
    reduceMotion = true; anchorRoot.querySelector('a').click();
    assert(scrollCall.behavior === 'auto', 'reduced motion disables native animation');
    destroyAnchors(); anchorRoot.remove();
    window.lenis = oldLenis; window.scrollTo = oldScrollTo; window.matchMedia = oldMatchMedia;
    history.replaceState(history.state, '', oldUrl);
    const oldRaf = window.requestAnimationFrame, oldCancelRaf = window.cancelAnimationFrame;
    window.requestAnimationFrame = callback => setTimeout(() => callback(performance.now()), 16);
    window.cancelAnimationFrame = timer => clearTimeout(timer);
    const navRoot = document.createElement('div');
    navRoot.innerHTML = '<nav class="styleguide-nav"><ul><li><a href="#spy-first">First</a></li><li><a href="#spy-second">Second</a></li></ul></nav><section id="spy-first"></section><section id="spy-second"></section>';
    document.body.append(navRoot);
    let firstTop = 1000, secondTop = 2000;
    navRoot.querySelector('#spy-first').getBoundingClientRect = () => ({ top: firstTop });
    navRoot.querySelector('#spy-second').getBoundingClientRect = () => ({ top: secondTop });
    const destroyNavigation = initStyleguide(navRoot);
    await new Promise(resolve => setTimeout(resolve, 40));
    assert(!navRoot.querySelector('[aria-current]'), 'no active section before catalogue');
    firstTop = -10;
    window.dispatchEvent(new Event('scroll')); await new Promise(resolve => setTimeout(resolve, 40));
    assert(navRoot.querySelector('[aria-current="location"]').hash === '#spy-first', 'first visible section is active');
    firstTop = -500; secondTop = -5;
    window.dispatchEvent(new Event('scroll')); await new Promise(resolve => setTimeout(resolve, 40));
    assert(navRoot.querySelectorAll('[aria-current="location"]').length === 1 && navRoot.querySelector('[aria-current="location"]').hash === '#spy-second', 'active section changes while scrolling down');
    firstTop = -5; secondTop = 1000;
    window.dispatchEvent(new Event('scroll')); await new Promise(resolve => setTimeout(resolve, 40));
    assert(navRoot.querySelector('[aria-current="location"]').hash === '#spy-first', 'active section changes while scrolling up');
    destroyNavigation();
    assert(!navRoot.querySelector('[aria-current]'), 'destroy removes active state');
    navRoot.remove();
    window.requestAnimationFrame = oldRaf; window.cancelAnimationFrame = oldCancelRaf;
    document.querySelector('#result').textContent = 'PASS: styleguide copy, feedback, errors and cleanup';
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.message;
}
</script>
