services:
  # http://127.0.0.1:5050
  librecrawl:
    build:
      context: .
      dockerfile: librecrawl/Dockerfile
    container_name: ${APP_NAME}-librecrawl
    ports:
      - "${LIBRECRAWL_HOST_BINDING:-127.0.0.1}:${LIBRECRAWL_PORT:-5050}:5000"
    extra_hosts:
      - "${DOMAIN}:host-gateway"
    volumes:
      - librecrawl_data:/app/data
    environment:
      - FLASK_APP=main.py
      - PYTHONUNBUFFERED=1
      - LOCAL_MODE=${LIBRECRAWL_LOCAL_MODE:-true}
      - REGISTRATION_DISABLED=${LIBRECRAWL_REGISTRATION_DISABLED:-false}
      - DEMO_MODE=${LIBRECRAWL_DEMO_MODE:-false}
      - DANGEROUSLY_SKIP_AUTH=${LIBRECRAWL_DANGEROUSLY_SKIP_AUTH:-false}
    restart: unless-stopped
    command: >
      sh -c "
      FLAGS='';
      if [ \"$$LOCAL_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --local\";
      fi;
      if [ \"$$REGISTRATION_DISABLED\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --disable-register\";
      fi;
      if [ \"$$DEMO_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --demo\";
      fi;
      if [ \"$$DANGEROUSLY_SKIP_AUTH\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --dangerously-skip-auth\";
      fi;
      python main.py $$FLAGS"
    shm_size: "2gb"
    profiles:
      - crawl

  # http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit
    container_name: ${APP_NAME}-mailpit
    ports:
      - 1025:1025
      - 8025:8025

  wordpress:
    build:
      context: .
      dockerfile: wordpress/Dockerfile
    container_name: ${APP_NAME}-wp
    environment:
      MYSQL_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ../.docker/wordpress/php.ini:/usr/local/etc/php/conf.d/php.ini
      - ../web:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      bash -c '
        if [ ! -d "/var/www/html/wp-content/themes/${WP_THEME_NAME}" ]
        then
            mv /var/www/html/wp-content/themes/default /var/www/html/wp-content/themes/${WP_THEME_NAME}
        fi
        php-fpm
      '

  sonarqube:
    image: sonarqube:latest
    container_name: ${APP_NAME}-sonarqube
    ports:
      - 9000:9000
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    profiles:
      - sonar

  postgres:
    image: postgres:16
    container_name: ${APP_NAME}-postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - sonar

  composer:
    image: composer:2
    container_name: ${APP_NAME}-composer
    working_dir: /var/www/html
    restart: "no"
    volumes:
      - ../web:/var/www/html:rw

  apache:
    build:
      context: .
      dockerfile: apache/Dockerfile
    container_name: ${APP_NAME}-apache
    ports:
      - 80:80
      - 443:443
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ../.docker/apache/default.conf:/usr/local/apache2/conf/extra/vhosts.conf.template
      - ../.docker/certs:/etc/certs
      - ../web:/var/www/html
    depends_on:
      - wordpress
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "httpd -t 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nodejs:
    build:
      context: .
      dockerfile: node/Dockerfile
    container_name: ${APP_NAME}-node
    environment:
      DOMAIN: ${DOMAIN}
      WP_THEME_NAME: ${WP_THEME_NAME}
      NODE_PORT: ${NODE_PORT}
    depends_on:
      - apache
      - wordpress
    working_dir: "/usr/app"
    volumes:
      - ../.browserslistrc:/usr/app/.browserslistrc
      - ../package.json:/usr/app/package.json
      - ../pnpm-lock.yaml:/usr/app/pnpm-lock.yaml:ro
      - ../rspack:/usr/app/rspack
      - ../assets:/usr/app/assets
      - ../web/wp-content/themes/${WP_THEME_NAME}:/usr/app/web/wp-content/themes/${WP_THEME_NAME}
      - ../.docker/certs:/etc/certs
      - pnpm_store:/usr/app/.pnpm-store
      - node_modules:/usr/app/node_modules
    ports:
      - 3000:3000
      - 3001:3001
    restart: unless-stopped
    command: >
      bash -c "
        PKG_HASH=$$(md5sum package.json pnpm-lock.yaml 2>/dev/null | md5sum | cut -d' ' -f1);
        if [ ! -f node_modules/.pkg_hash ] || [ \"$$PKG_HASH\" != \"$$(cat node_modules/.pkg_hash)\" ]; then
          pnpm install --frozen-lockfile;
          echo $$PKG_HASH > node_modules/.pkg_hash;
        fi;
        pnpm run dev
      "

volumes:
  sonarqube_data: {}
  sonarqube_extensions: {}
  sonarqube_logs: {}
  postgresql: {}
  postgresql_data: {}
  pnpm_store: {}
  node_modules: {}
  librecrawl_data: {}
